id: de.rwth_aachen.ient.YUView
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: YUView
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --filesystem=host
  - --env=QT_NO_FT_CACHE=1
  - --device=dri

modules:
  - name: libde265
    buildsystem: cmake-ninja
    config-opts:
      - -DONLY_LIB=ON
      - -DCMAKE_INSTALL_LIBDIR:PATH=/app/lib
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    build-options:
      arch:
        aarch64:
          cflags: -fPIC
          cxxflags: -fPIC
          ldflags: -fPIC
    sources:
      - type: git
        # branch: internal
        url: https://github.com/nolyn/libde265.git
        commit: e655e91d7495785996552e935f308f45c0e6e161

  - name: YUView
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: .
