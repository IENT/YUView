app-id: de.rwth_aachen.ient.YUView
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: YUView
finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --share=network  
  - --filesystem=host
  - --env=QT_NO_FT_CACHE=1

modules:
  - name: libde265
    buildsystem: cmake-ninja
    config-opts:
      - -DONLY_LIB=ON
      - -DCMAKE_INSTALL_LIBDIR:PATH=/app/lib
    sources:
      - type: git
        branch: internal
        url: https://github.com/nolyn/libde265.git
        commit: e655e91d7495785996552e935f308f45c0e6e161

  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --enable-gnutls
      - --disable-doc
      - --disable-programs
      - --disable-encoders
      - --disable-muxers
      - --enable-encoder=png
    sources:
      - type: archive
        url: https://www.ffmpeg.org/releases/ffmpeg-7.1.2.tar.xz
        sha256: 089bc60fb59d6aecc5d994ff530fd0dcb3ee39aa55867849a2bbc4e555f9c304
    cleanup:
      - /share/ffmpeg/examples

  - name: YUView
    buildsystem: qmake
    sources:
      - type: dir
        path: .
      # Bake .qsb before qmake/rcc so shaders.qrc can embed them.
      - type: shell
        commands:
          - chmod +x YUViewLib/resources/shaders/compile_shaders.sh
          - ./YUViewLib/resources/shaders/compile_shaders.sh
