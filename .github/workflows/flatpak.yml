# This is a basic workflow to help you get started with Actions

name: CI flatpak

# Controls when the action will run. 
on:
  # Trigger the workflow if we merged into develop or if we create a release
  # Since the workflow takes significantly longer (because of the ffmpeg build) we want to execute 
  # this as little as possible.
  push:
    branches: [ develop ]
  release:
    branches: [ develop ]
    types:
      - created
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  flatpak-builder:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: "ubuntu-26.04"
          - arch: aarch64
            runner: "ubuntu-26.04-arm"
      fail-fast: false
    runs-on: ${{ matrix.variant.runner }}
    steps:
    - uses: actions/checkout@v6
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: "YUView.flatpak"
        manifest-path: "de.rwth_aachen.ient.YUView.yaml"
        arch: ${{ matrix.variant.arch }}
    - name: Upload Release
      uses: actions/upload-release-asset@v1.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: YUView.flatpak
        asset_name: YUView.flatpak
        asset_content_type: application/zip
      if: github.event_name == 'release' 
